name = "lounge-backend"
main = "src/worker.ts"
compatibility_date = "2026-02-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.lounge.eduardcazacu.com", zone_name = "eduardcazacu.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1


# Hyperdrive: pooled Postgres connections next to the Worker. Without it every
# request opened its own connection to the database, which was most of what
# each API call cost. Create it with caching DISABLED — a cached inbox would
# hide a new instant for up to a minute (wiki/gotchas.md):
#
#   npx wrangler hyperdrive create lounge-db \
#     --connection-string="<DATABASE_URL>" --caching-disabled
#
# then uncomment this block and paste the id it printed. Until then the Worker
# falls back to DATABASE_URL (src/env.ts). `npm run dev:worker` with the block
# enabled needs a local connection string; see backend/README.md.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "a806fedd74ac45ceaac2e5752a8e73ec"

# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "eddies-lounge-images"

# Instant's realtime inbox. One object per user, addressed as `user:<id>`.
# SQLite-backed classes are the default for new Durable Objects and are
# available on the Workers Free plan.
[[durable_objects.bindings]]
name = "INSTANT_INBOX"
class_name = "InstantInbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstantInbox"]

# Hourly Instant maintenance: expire unopened media, lapse dead streaks, and
# warn people whose long streaks are about to end. See src/scheduled.ts.
[triggers]
crons = ["0 * * * *"]

[vars]
# Public dev URL for the bucket domain, e.g. https://pub-xxxxxxxx.r2.dev
# Add this same var in the Cloudflare dashboard or via Wrangler for each environment.
R2_PUBLIC_BASE_URL = "https://images.lounge.eduardcazacu.com"

